[workspace]
authors = ["ZHU Yuhao (朱宇浩) <dr.yuhao.zhu@outlook.com>"]
channels = ["https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
description = "An arbitrary-precision decimal and integer library for Mojo"
license = "Apache-2.0"
name = "decimo"
platforms = ["osx-arm64", "linux-64"]
readme = "README.md"
version = "0.14.0"

[dependencies]
# CLI argument parsing for the Decimo calculator. `pixi run buildcli`
# falls back to the pinned upstream commit (see src/cli/ensure_argmojo.sh).
# if the following line is commented out.
argmojo = ">=0.8.0,<0.9.0"
mojo = ">=1.0.0,<1.1.0" # Mojo language compiler and runtime
python = ">=3.13" # For Python bindings and tests
ruff = ">=0.15.0" # Python code formatter
pre-commit = ">=4.6.1,<5"

[tasks]
# format the code
format = """pixi run clean \
&& pixi run mojo format ./src \
&& pixi run mojo format ./python \
&& pixi run mojo format ./benches \
&& pixi run mojo format ./tests \
&& pixi run mojo format ./docs \
&& pixi run ruff format ./python"""

# doc
# Note: the CLI calculator doc step uses `-I tests` (the prebuilt
# `decimo.mojoc`) instead of `-I src`. Mojo's `mojo doc` cannot
# resolve `decimo.X.Y.foo`-style qualified references when re-traversing
# the source tree via `-I src`. Loading the pre-built package via
# `-I tests` sidesteps that regression. The `package` task below is
# therefore reordered so `package_decimo` runs before `doc`.
# `-I src/cli` resolves `limo` from source. Without it the step silently
# fell back to the stale `limo.mojopkg` left at the repo root, which the
# 1.1 compiler now rejects ("missing version information"); source also
# takes precedence over that legacy artifact, so it can be deleted.
doc = """pixi run mojo doc --diagnose-missing-doc-strings src/decimo > /dev/null \
&& pixi run mojo doc --diagnose-missing-doc-strings -I tests -I src/cli src/cli/calculator > /dev/null"""

# compile the package
p = "clear && pixi run package"
package = """pixi run format \
&&pixi run package_decimo \
&&pixi run doc"""
package_decimo = """pixi run mojo precompile src/decimo -o decimo.mojoc \
&&cp decimo.mojoc tests/ \
&&cp decimo.mojoc benches/ \
&&rm decimo.mojoc"""

# clean the package files in tests folder
c = "clear && pixi run clean"
# `-f`: `clean` runs first inside `format` (and hence `all`), so it must not
# fail when the artifacts are absent (fresh checkout, or after a previous run).
clean = "rm -f tests/decimo.mojoc benches/decimo.mojoc"

# gmp/mpfr wrapper (compile C wrapper — no MPFR needed at build time)
bgmp = "clear && pixi run buildgmp"
buildgmp = "bash src/decimo/gmp/build_gmp_wrapper.sh"

# tests (use the mojo testing tool)
test = "bash tests/test.sh"
# bigfloat (build test binary linking the C wrapper, then run it)
testfloat = "pixi run buildgmp && bash tests/test.sh bigfloat"
# shortcut for tests
t = "clear && pixi run test"
tf = "clear && pixi run testfloat"

# quick build & run for a single BigFloat-using .mojo file
# Usage: pixi run bf path/to/file.mojo
bf = {cmd = "bash examples/run_bigfloat.sh", description = "Build & run a single BigFloat .mojo file (output binary in temp/)"}

# bench
bench = "pixi run package && bash benches/run_bench.sh"
# regenerate docs/benchmarks.md from a fresh measurement run
benchdoc = "python benches/doc/generate.py"

# bench with debug assertions enabled
bdec_debug = """clear && pixi run package && cd benches/bigdecimal \
&&pixi run mojo run -I ../ -D ASSERT=all bench.mojo && cd ../.. \
&&pixi run clean"""
bint_debug = """clear && pixi run package && cd benches/bigint/mojo \
&&pixi run mojo run -I ../../../src -D ASSERT=all bench.mojo --op add && cd ../../.. \
&&pixi run clean"""
buint_debug = """clear && pixi run package && cd benches/biguint \
&&pixi run mojo run -I ../ -D ASSERT=all bench.mojo && cd ../.. \
&&pixi run clean"""
dec_debug = """clear && pixi run package && cd benches/decimal128 \
&&pixi run mojo run -I ../ -D ASSERT=all bench.mojo && cd ../.. \
&&pixi run clean"""

# Resolve argmojo for the CLI calculator: use the conda package if the
# environment provides one, otherwise clone + precompile the pinned upstream
# commit (release v0.8.0) into temp/argmojo.mojoc.
# Overrides: DECIMO_ARGMOJO=conda|git, ARGMOJO_COMMIT=<sha>
argmojo = "bash src/cli/ensure_argmojo.sh"

# cli calculator
bcli = "clear && pixi run buildcli"
# `pixi run argmojo` picks the conda package when it is installed and
# otherwise drops temp/argmojo.mojoc from the pinned upstream commit. Either
# way decimo is packaged into temp/ as well, so the CLI build (and downstream
# `testcli`) only needs `-I temp`.
buildcli = """pixi run argmojo \
&& mkdir -p temp \
&& pixi run mojo precompile src/decimo -o temp/decimo.mojoc \
&& pixi run mojo build -I temp -I src/cli -o decimo src/cli/main.mojo"""
tcli = "clear && pixi run test cli"
testcli = "pixi run buildcli && cp temp/decimo.mojoc tests/ && bash tests/test.sh cli"

# python bindings (mojo4py)
bpy = "clear && pixi run buildpy"
buildpy = """pixi run mojo precompile src/decimo -o tests/decimo.mojoc \
&& pixi run mojo build python/decimo_module.mojo \
--emit shared-lib -I tests -o python/src/decimo/_decimo.so"""
testpy = "pixi run buildpy && pixi run python python/tests/test_decimo.py"
tpy = "clear && pixi run testpy"
# Build a self-contained PyPI wheel: compile the extension, copy the Mojo
# runtime libraries in beside it, stamp a version, build, check.
#   pixi run release              build only, leaves the wheel in python/dist/
#   pixi run release --testpypi   upload to TestPyPI
#   pixi run release --pypi       upload to PyPI
#   pixi run release --version 0.2.0
# Without --version the wheel is stamped 0.1.0.devYYYYMMDDHHMMSS in UTC, so
# every development build has a version PyPI has not seen before.
release = """pixi run buildpy \
&& pixi run -e publish python python/build_wheel.py"""
# The old name, kept because muscle memory is a real thing.
wheel = "pixi run release"

# All task
all = """pixi run format \
&&pixi run package \
&&pixi run test \
&&pixi run buildcli \
&&pixi run testcli \
&&pixi run buildpy \
&&pixi run testpy \
&&pixi run clean"""


# ===----------------------------------------------------------------------=== #
# Optional environments
#
# Each of these adds packages that only one workflow needs, so a plain
# `pixi install` stays small for someone who just wants to build and test.
# They include the default feature, so everything above is still available.
# ===----------------------------------------------------------------------=== #

# `pixi run benchdoc`. Reference libraries for the pi comparison in
# `docs/benchmarks.md`. The benchmark runs without them and reports the
# missing entries rather than dropping the column.
[feature.benchdoc.pypi-dependencies]
mpmath = ">=1.3"
gmpy2 = ">=2.2"

# `pixi run wheel` and uploading it. Only needed to cut a release.
[feature.publish.dependencies]
python-build = ">=0.2.0"
twine = ">=6.2.0"

[environments]
benchdoc = ["benchdoc"]
publish = ["publish"]
