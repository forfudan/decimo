# rumdl — Markdown line wrapper for decimo's prose docs.
#
# Scoped to MD013 (line-length) only. The goal is 80-column prose
# wrapping, not a repo-wide Markdown restyle, so every other markdownlint
# rule stays off and the diffs stay prose-only: bullet markers, emphasis
# characters, heading style and table padding are left as written.
#
# Run via `pixi run formatmd`.

[global]
enable = ["MD013"]
# CJK text has no spaces to break on, so rumdl can only wrap at the ASCII
# boundaries. On the Traditional Chinese README that yields two-word lines
# followed by a still-400-column paragraph, so it is left alone.
exclude = ["docs/readme_zht.md"]

[MD013]
line-length = 80
reflow = true
# Code fences and headings cannot be reflowed; checking them only produces
# warnings that no fix can ever clear.
code-blocks = false
headings = false
