[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
# `.gitignore` excludes `*.so` and `*.dylib`, and hatchling honours that, so
# the compiled parts have to be named here or the wheel ships without them.
artifacts = ["src/decimo/*.so", "src/decimo/*.dylib"]
packages = ["src/decimo"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
path = "src/decimo/_version.py"

[project]
authors = [{name = "ZHU Yuhao (朱宇浩)", email = "dr.yuhao.zhu@outlook.com"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
description = "Arbitrary-precision decimal arithmetic for Python, powered by Mojo"
keywords = [
  "decimal",
  "arbitrary-precision",
  "mojo",
  "bigdecimal",
  "arithmetic",
  "numeric",
]
license = {text = "Apache-2.0"}
name = "decimo"
readme = "README.md"
requires-python = ">=3.11"
# Stamped by `pixi run release`, which writes src/decimo/_version.py.
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/forfudan/decimo/blob/main/docs/changelog.md"
Homepage = "https://github.com/forfudan/decimo"
Issues = "https://github.com/forfudan/decimo/issues"
Repository = "https://github.com/forfudan/decimo"
