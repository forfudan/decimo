# ===----------------------------------------------------------------------=== #
# Test cases for Decimal128 multiplication
# ===----------------------------------------------------------------------=== #

# ===----------------------------------------------------------------------=== #
# Basic multiplication
# ===----------------------------------------------------------------------=== #

[[basic_tests]]
a = "5"
b = "3"
description = "Simple integer multiplication"
expected = "15"

[[basic_tests]]
a = "2.5"
b = "4"
description = "Decimal times integer"
expected = "10.0"

[[basic_tests]]
a = "1.5"
b = "2.5"
description = "Decimal times decimal"
expected = "3.75"

[[basic_tests]]
a = "3.14"
b = "2.0"
description = "Multiplication with more decimal places"
expected = "6.280"

[[basic_tests]]
a = "0.125"
b = "0.4"
description = "Small decimal multiplication"
expected = "0.0500"

# ===----------------------------------------------------------------------=== #
# Special cases (zero, one)
# ===----------------------------------------------------------------------=== #

[[special_tests]]
a = "123.45"
b = "0"
description = "Multiplication by zero"
expected = "0.00"

[[special_tests]]
a = "123.45"
b = "1"
description = "Multiplication by one"
expected = "123.45"

[[special_tests]]
a = "0"
b = "987.654"
description = "Zero times any number"
expected = "0.000"

[[special_tests]]
a = "123.45"
b = "-1"
description = "Multiplication by negative one"
expected = "-123.45"

# ===----------------------------------------------------------------------=== #
# Negative multiplication
# ===----------------------------------------------------------------------=== #

[[negative_tests]]
a = "-5"
b = "3"
description = "Negative times positive"
expected = "-15"

[[negative_tests]]
a = "5"
b = "-3"
description = "Positive times negative"
expected = "-15"

[[negative_tests]]
a = "-5"
b = "-3"
description = "Negative times negative"
expected = "15"

[[negative_tests]]
a = "-2.5"
b = "4.2"
description = "Negative decimal multiplication"
expected = "-10.50"

[[negative_tests]]
a = "-0"
b = "123.45"
description = "Negative zero times positive"
expected = "-0.00"

# ===----------------------------------------------------------------------=== #
# Precision and scale
# ===----------------------------------------------------------------------=== #

[[precision_tests]]
a = "0.5"
b = "0.25"
description = "Scale addition (1+2=3)"
expected = "0.125"

[[precision_tests]]
a = "0.1234567890"
b = "0.9876543210"
description = "High precision multiplication"
expected = "0.12193263111263526900"

# ===----------------------------------------------------------------------=== #
# Boundary cases
# ===----------------------------------------------------------------------=== #

[[boundary_tests]]
a = "0.5"
b = "2.0"
description = "Result becomes integer"
expected = "1.00"

[[boundary_tests]]
a = "1.25"
b = "4"
description = "Result with trailing zeros"
expected = "5.00"

# ===----------------------------------------------------------------------=== #
# Commutative property (a*b and b*a both tested)
# ===----------------------------------------------------------------------=== #

[[commutative_tests]]
a = "10"
b = "20"
description = "Commutative: integers"
expected = "200"

[[commutative_tests]]
a = "3.5"
b = "2"
description = "Commutative: mixed decimal and integer"
expected = "7.0"

[[commutative_tests]]
a = "-5"
b = "7"
description = "Commutative: negative and positive"
expected = "-35"

[[commutative_tests]]
a = "0.123"
b = "9.87"
description = "Commutative: small and large decimal"
expected = "1.21401"

[[commutative_tests]]
a = "0.0001"
b = "10000"
description = "Commutative: very small and very large"
expected = "1.0000"

# ===----------------------------------------------------------------------=== #
# Granlund-Möller UInt256 / 10^k stress sweep
# ===----------------------------------------------------------------------=== #
# Generated cases that exercise the multiply hot path with rescale
# counts k ∈ [1, 28] (the GM divider's coverage range, capped at
# MAX_SCALE=28 since input scales cannot exceed that), plus large-int
# × small-fraction, MAX-class, transcendental, negative-product and
# all-integer variants.
#
# Expected values are the agreement of three independent industry
# implementations of fixed-precision (≤28-digit) decimal multiplication:
# Rust `rust_decimal` 1.36, C# `System.Decimal` (.NET 10), and VB.NET
# `System.Decimal` (.NET 10). All three references agree byte-for-byte
# on every case below; the values shown were generated from
# `rust_decimal` and verified against C# and VB.NET in CI scaffolding
# at the time the section was written. Decimo's multiply path matches
# this canonical reference (single-step HALF_EVEN from the full-precision
# product) thanks to the round-then-fit single-step rounding fix landed
# in the same commit as the GM divider — see plan §4.10 (notes for #10
# take-away → multiply rounding fix).

[[gm_stress_tests]]
a = "0.1247694506653658249321085341"
b = "0.5"
description = "GM divider sweep: k=1"
expected = "0.0623847253326829124660542670"

[[gm_stress_tests]]
