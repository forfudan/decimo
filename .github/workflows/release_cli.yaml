name: Build CLI release tarball

# Builds the `decimo` CLI binary for every platform we ship it on, packaged
# as release tarballs that the Homebrew formula in
# https://github.com/forfudan/homebrew-tap downloads.
#
# Three tarballs, one per target:
#   - decimo-<version>-darwin-arm64.tar.gz
#   - decimo-<version>-linux-x86_64.tar.gz
#   - decimo-<version>-linux-aarch64.tar.gz
#
# Two ways in:
#
#   * publish a GitHub Release, and the version is its tag without the `v`.
#     The tarballs and their SHA-256 files are attached to that release
#     automatically. This is how a real release goes out. The tag has to
#     match the library version in `pixi.toml`, or the run stops -- the same
#     check `release_python.yaml` makes, and for the same reason.
#   * by hand from the Actions tab -> "Build CLI release tarball" -> Run
#     workflow, where the version may be given and otherwise comes from
#     `pixi.toml`. A manual run keeps the tarballs as artifacts and attaches
#     nothing, since there may be no release to attach them to.
#
# This used to be `workflow_dispatch` alone, with a comment asking whoever
# released to download each artifact and attach it by hand. That step was
# missed for v0.11.0, v0.12.0 and v0.13.0 -- all three shipped with only
# `decimo.mojoc` attached -- which left Homebrew on v0.10.0 for four months.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.14.0 (empty: pixi.toml)"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One version for the whole run, resolved once, so the three build jobs
  # cannot disagree about what they are packaging.
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          library=$(sed -n 's/^version = "\(.*\)"/\1/p' pixi.toml | head -1)
          if [[ -z "$library" ]]; then
            echo "no version in pixi.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="${RELEASE_TAG#v}"
            if [[ "$version" != "$library" ]]; then
              echo "release $RELEASE_TAG and pixi.toml $library disagree" >&2
              exit 1
            fi
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="$library"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "packaging $version"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  build:
    name: Build ${{ matrix.target }} tarball
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          # 22.04 on both Linux rows, so the tarballs run against the same
          # glibc the wheels are built for (2.35). A newer runner would raise
          # the floor for no gain.
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: macos-14          # Apple Silicon (arm64)
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | sh

      - name: Add pixi to PATH
        run: |
          echo "PIXI_HOME=$HOME/.pixi" >> $GITHUB_ENV
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: pixi install
        run: pixi install

      - name: Build CLI binary (with retry for Mojo intermittent crashes)
        run: |
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ==="
            if pixi run buildcli; then
              echo "=== build succeeded on attempt $attempt ==="
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "=== build failed after 3 attempts ==="
              exit 1
            fi
            echo "=== build crashed, retrying in 5s... ==="
            sleep 5
          done

      - name: Sanity check binary
        run: |
          file decimo
          # Note: cannot run ./decimo --version here on Linux because the
          # binary's hard-coded rpath points into the build env. The "Bundle
          # runtime" step below makes the binary relocatable; we re-test
          # after that.

      - name: Bundle Mojo runtime + patch rpath
        # The Mojo binary depends on a handful of runtime shared libraries
        # that live in the Pixi env (libKGENCompilerRTShared, libAsync*,
        # libMSupport*, ...). The build embeds an absolute @rpath that
        # points at the build runner's filesystem, so the binary is not
        # relocatable as-shipped.
        #
        # We:
        #   1. Discover every @rpath/... dependency (recursively) of the
        #      binary inside the Pixi env.
        #   2. Copy each one into dist/<pkg>/lib/ alongside the binary.
        #   3. Rewrite the binary + each bundled lib's rpath so they look
        #      for siblings via $ORIGIN/.. (Linux) or
        #      @executable_path/../lib (macOS).
        #   4. On macOS, re-sign with an ad-hoc signature (required after
        #      install_name_tool surgery on Apple Silicon).
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PKG="decimo-${VERSION}-${{ matrix.target }}"
          STAGE="dist/${PKG}"
          mkdir -p "${STAGE}/bin" "${STAGE}/lib" "${STAGE}/THIRD_PARTY_LICENSES"
          cp decimo "${STAGE}/bin/"
          cp LICENSE NOTICE README.md "${STAGE}/"

          # Ship the license texts of the bundled third-party runtime
          # libraries alongside the binary, as required by §3 of the
          # Modular Community License (the text of the Agreement must
          # be conspicuously displayed in each copy of the SDK) and as
          # required by the GCC Runtime Library Exception on Linux.
          #
          # The texts are vendored in the repo under THIRD_PARTY_LICENSES/
          # so release artifacts are deterministic and reproducible — we
          # do not scrape upstream HTML at build time. If a vendored file
          # is missing the build fails here, on purpose, so we never ship
          # a tarball without the full license text.
          if [[ ! -f THIRD_PARTY_LICENSES/MODULAR_COMMUNITY_LICENSE.txt ]]; then
            echo "Missing vendored Modular Community License text at THIRD_PARTY_LICENSES/MODULAR_COMMUNITY_LICENSE.txt" >&2
            exit 1
          fi
          cp THIRD_PARTY_LICENSES/MODULAR_COMMUNITY_LICENSE.txt \
             "${STAGE}/THIRD_PARTY_LICENSES/MODULAR_COMMUNITY_LICENSE.txt"

          if [[ -f THIRD_PARTY_LICENSES/README.md ]]; then
            cp THIRD_PARTY_LICENSES/README.md \
               "${STAGE}/THIRD_PARTY_LICENSES/README.md"
          fi

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ ! -f THIRD_PARTY_LICENSES/GCC_RUNTIME_LIBRARY_EXCEPTION.txt ]]; then
              echo "Missing vendored GCC Runtime Library Exception text at THIRD_PARTY_LICENSES/GCC_RUNTIME_LIBRARY_EXCEPTION.txt" >&2
              exit 1
            fi
            cp THIRD_PARTY_LICENSES/GCC_RUNTIME_LIBRARY_EXCEPTION.txt \
               "${STAGE}/THIRD_PARTY_LICENSES/GCC_RUNTIME_LIBRARY_EXCEPTION.txt"
          fi

          PIXI_LIB="$(pwd)/.pixi/envs/default/lib"
          echo "Pixi lib dir: ${PIXI_LIB}"

          # macOS runners ship bash 3.2 (no associative arrays). Track
          # already-bundled libs by checking whether the file exists in
          # ${STAGE}/lib instead of using a `declare -A` map.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Recursively collect @rpath/<name> deps of the binary and any
            # bundled lib until the closure is stable.
            QUEUE=("${STAGE}/bin/decimo")
            while [ ${#QUEUE[@]} -gt 0 ]; do
              CURRENT="${QUEUE[0]}"
              if [ ${#QUEUE[@]} -gt 1 ]; then
                QUEUE=("${QUEUE[@]:1}")
              else
                QUEUE=()
              fi
              while IFS= read -r dep; do
                name="${dep#@rpath/}"
                if [[ ! -f "${STAGE}/lib/${name}" && -f "${PIXI_LIB}/${name}" ]]; then
                  echo "Bundling ${name}"
                  cp "${PIXI_LIB}/${name}" "${STAGE}/lib/${name}"
                  QUEUE+=("${STAGE}/lib/${name}")
                fi
              done < <(otool -L "$CURRENT" 2>/dev/null \
                       | awk '/@rpath\//{print $1}')
            done

            # Strip the build-time absolute rpath and add a relocatable one.
            for f in "${STAGE}/bin/decimo" "${STAGE}/lib/"*.dylib; do
              [[ -f "$f" ]] || continue
              while IFS= read -r r; do
                install_name_tool -delete_rpath "$r" "$f" 2>/dev/null || true
              done < <(otool -l "$f" \
                       | awk '/LC_RPATH/{flag=1;next} flag && /path /{print $2;flag=0}')
              if [[ "$f" == *"/bin/"* ]]; then
                install_name_tool -add_rpath "@executable_path/../lib" "$f"
              else
                install_name_tool -add_rpath "@loader_path" "$f"
              fi
              codesign --force --sign - "$f"
            done
          else
            # Linux: same approach but with patchelf and ldd.
            sudo apt-get update -qq
            sudo apt-get install -y patchelf
            QUEUE=("${STAGE}/bin/decimo")
            while [ ${#QUEUE[@]} -gt 0 ]; do
              CURRENT="${QUEUE[0]}"
              if [ ${#QUEUE[@]} -gt 1 ]; then
                QUEUE=("${QUEUE[@]:1}")
              else
                QUEUE=()
              fi
              # Look at DT_NEEDED entries; bundle any that resolve inside
              # the Pixi env (system libs are left to the loader).
              while IFS= read -r name; do
                [[ -z "$name" ]] && continue
                if [[ ! -f "${STAGE}/lib/${name}" && -f "${PIXI_LIB}/${name}" ]]; then
                  echo "Bundling ${name}"
                  cp "${PIXI_LIB}/${name}" "${STAGE}/lib/${name}"
                  QUEUE+=("${STAGE}/lib/${name}")
                fi
              done < <(patchelf --print-needed "$CURRENT" 2>/dev/null)
            done

            for f in "${STAGE}/bin/decimo" "${STAGE}/lib/"*.so*; do
              [[ -f "$f" ]] || continue
              if [[ "$f" == *"/bin/"* ]]; then
                patchelf --set-rpath '$ORIGIN/../lib' "$f"
              else
                patchelf --set-rpath '$ORIGIN' "$f"
              fi
            done
          fi

          echo "--- staged tree ---"
          ls -la "${STAGE}" "${STAGE}/bin" "${STAGE}/lib"

      - name: Smoke-test bundled binary
        # Run from a directory unrelated to the build path to confirm the
        # binary really is relocatable.
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PKG="decimo-${VERSION}-${{ matrix.target }}"
          mkdir -p "$RUNNER_TEMP/relocation_test"
          cp -R "dist/${PKG}" "$RUNNER_TEMP/relocation_test/"
          "$RUNNER_TEMP/relocation_test/${PKG}/bin/decimo" --version

      - name: Package tarball
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PKG="decimo-${VERSION}-${{ matrix.target }}"
          ( cd dist && tar -czf "${PKG}.tar.gz" "${PKG}" )
          echo "--- SHA-256 ---"
          shasum -a 256 "dist/${PKG}.tar.gz" | tee "dist/${PKG}.tar.gz.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: decimo-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/decimo-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 14

  # The step that kept being forgotten. `--clobber` so that re-running a
  # release replaces the assets rather than failing on the second attempt.
  attach:
    name: Attach the tarballs to the release
    if: github.event_name == 'release'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: decimo-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Upload to the release
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached to $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
