name: Build Python wheels

# Builds the `decimo` wheel for every supported interpreter and platform,
# and uploads the set to PyPI (or TestPyPI) when asked.
#
# Trigger from the Actions tab -> "Build Python wheels" -> Run workflow.
# Leave the version empty for a dev build (0.1.0.devYYYYMMDDHHMMSS), which
# PyPI accepts as a new version every time. Choose "none" as the target to
# only build and keep the wheels as artifacts.
#
# Uploading uses PyPI trusted publishing: the project on PyPI has to list
# this repository and this workflow file as a publisher, under the
# environment name `pypi` (or `testpypi`). No token is stored anywhere.
# See https://docs.pypi.org/trusted-publishers/.

on:
  # A pull request that touches the package builds the wheels (no upload),
  # so the Linux and macOS builds are checked before anything reaches main.
  pull_request:
    paths:
      - "python/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/release_python.yaml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp, e.g. 0.2.0 (empty: dev timestamp)"
        required: false
        default: ""
      target:
        description: "Where to upload"
        required: true
        default: "none"
        type: choice
        options: [none, testpypi, pypi]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.environment }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        environment: [py313, py314]
        # ubuntu-22.04 is glibc 2.35, so the wheels are manylinux_2_35;
        # macos-14 is the oldest arm64 runner, matching the 14.0 target.
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: ${{ matrix.environment }}

      # The extension is built, the Python test suite is run against it, and
      # the wheel is assembled, in the environment whose interpreter it is
      # tagged for. Mojo occasionally crashes at build time; the build step
      # is retried rather than the whole job.
      - name: Build, test and package
        run: |
          version_flag=""
          if [[ -n "${{ inputs.version || '' }}" ]]; then
            version_flag="--version ${{ inputs.version }}"
          fi
          for attempt in 1 2 3; do
            if pixi run -e ${{ matrix.environment }} release $version_flag; then
              break
            fi
            if [[ $attempt -eq 3 ]]; then exit 1; fi
            echo "build failed, retrying in 5s"
            sleep 5
          done

      - name: Install the wheel into a clean interpreter and import it
        run: |
          pixi run -e ${{ matrix.environment }} python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet python/dist/*.whl
          cd /tmp && /tmp/probe/bin/python -c "
          from decimo import Decimal, getcontext, ROUND_DOWN
          getcontext().prec = 50
          print(Decimal(1) / Decimal(7))
          getcontext().rounding = ROUND_DOWN
          assert str(Decimal('2.5').quantize(Decimal('1'))) == '2'
          import decimo; print('decimo', decimo.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.environment }}-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    name: Upload to ${{ inputs.target }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'none' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Upload to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
