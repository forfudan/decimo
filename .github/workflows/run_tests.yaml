  # ── Test: Traits ──────────────────────────────────────────────────────────
  # `Numeric`, `Parsable` and `Rootable`. These suites are generic code, so a
  # conformance that no longer holds is a compile error rather than a failed
  # assertion, and only a job that builds them catches it.
