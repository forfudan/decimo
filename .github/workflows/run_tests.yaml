  # ── Test: CLI ────────────────────────────────────────────────────────────────
  # The CLI test needs a freshly built binary, not the .mojopkg, so we
  # invoke `pixi run buildcli` here. Uses cached pixi env (no curl install,
  # no second `pixi install` from scratch).
  test-cli:
    name: Test CLI
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
