name: Decimo Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

# The `build` job is the gate: format check, doc generation, and the
# `decimo.mojoc` build all run once. The package is uploaded as an
# artifact so downstream test jobs can download it instead of rebuilding
# (saves ~30s of `mojo precompile` per job × 10 jobs). The pixi environment
# is cached by `prefix-dev/setup-pixi@v0.10.2`, so test jobs no longer
# `curl | sh` and `pixi install` from scratch.

jobs:
  # ── Gate: Format + Doc + Build package ───────────────────────────────────────
  build:
    name: Build & Format & Doc
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          activate-environment: true
      # See `.github/actions/setup-decimo` for why this exists and why it is
      # restored after `setup-pixi`. This job compiles the package itself, so
      # it wants its own entry rather than a test job's.
      - name: Restore the Mojo compilation cache
        uses: actions/cache@v6
        with:
          path: .pixi/envs/default/share/max/cache/.mojo_cache
          key: mojo-cache-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-build-${{ github.sha }}
          restore-keys: |
            mojo-cache-${{ runner.os }}-${{ hashFiles('pixi.lock') }}-build-
      - name: Trim cache entries older than a week
        run: |
          cache_dir=.pixi/envs/default/share/max/cache/.mojo_cache
          if [[ -d $cache_dir ]]; then
            before=$(du -sm "$cache_dir" | cut -f1)
            find "$cache_dir" -type f -mtime +7 -delete 2>/dev/null || true
            find "$cache_dir" -type d -empty -delete 2>/dev/null || true
            echo "Mojo cache restored: ${before} MB, $(du -sm "$cache_dir" | cut -f1) MB after trimming"
          else
            echo "Mojo cache: cold, nothing restored"
          fi
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Format check
        run: pre-commit run --all-files
      - name: Build package (with retry for Mojo compiler intermittent crashes)
        run: |
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ==="
            if pixi run mojo precompile src/decimo -o decimo.mojoc; then
              echo "=== build succeeded on attempt $attempt ==="
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "=== build failed after 3 attempts ==="
              exit 1
            fi
            echo "=== build crashed, retrying in 5s... ==="
            sleep 5
          done
      - name: Stage decimo.mojoc next to tests
        # `pixi run doc` documents `src/cli/calculator`, which imports
        # `decimo.*`. Mojo cannot resolve those qualified
        # references when re-traversing the source tree via `-I src`,
        # so the doc task uses `-I tests` against the prebuilt
        # `decimo.mojoc`. Stage it here before invoking doc.
        run: cp decimo.mojoc tests/
      - name: Generate docs (with retry for Mojo compiler intermittent crashes)
        run: |
          for attempt in 1 2 3; do
            echo "=== doc attempt $attempt ==="
            if pixi run doc; then
              echo "=== doc succeeded on attempt $attempt ==="
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "=== doc failed after 3 attempts ==="
              exit 1
            fi
            echo "=== doc crashed, retrying in 5s... ==="
            sleep 5
          done
      - name: Verify decimo.mojoc was produced
        run: test -f decimo.mojoc
      - name: Upload decimo.mojoc artifact
        uses: actions/upload-artifact@v7
        with:
          name: decimo-mojoc
          path: decimo.mojoc
          retention-days: 1
          if-no-files-found: error

  # ── Test: BigDecimal ─────────────────────────────────────────────────────────
  test-bigdecimal:
    name: Test BigDecimal
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-decimo
      - name: Run tests (with retry for Mojo compiler intermittent crashes)
        run: |
          for attempt in 1 2 3; do
            echo "=== test attempt $attempt ==="
            if bash tests/test.sh bigdecimal; then
